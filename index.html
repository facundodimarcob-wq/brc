<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRC Estado</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BRC Estado">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 350px; margin: 20px auto; }
        input { width: 85%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 90%; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .hidden { display: none; }
        #contador { font-size: 28px; color: #dc3545; font-weight: bold; margin: 15px 0; }
        #encargado { font-size: 14px; color: #666; font-style: italic; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="auth-section" class="card">
        <h2>Ingresar al Sistema</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <input type="text" id="grupo" placeholder="Código de tu Grupo">
        <button id="btn-login" style="margin-top: 10px;">Entrar / Registrarse</button>
    </div>

    <div id="app-section" class="card hidden">
        <h3>Grupo: <span id="nombre-grupo" style="color: #007bff;">---</span></h3>
        
        <button id="btn-ocupado">Ocupado BRC por 1 hora</button>
        
        <div id="contador" class="hidden">01:00:00</div>
        <div id="encargado" class="hidden">Ocupado por: <span>---</span></div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>Participantes:</h4>
        <ul id="lista-participantes"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoB3CCORIJN23iND5SJ5yRzXyxCgrKlb8",
            authDomain: "fag-brc.firebaseapp.com",
            projectId: "fag-brc",
            storageBucket: "fag-brc.firebasestorage.app",
            messagingSenderId: "614181842111",
            appId: "1:614181842111:web:f0f887f065b14317e9aa0a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        let usuarioActual = null;
        let grupoActualId = null;
        let intervaloContador = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(reg => console.log('Service Worker registrado con éxito', reg))
            .catch(err => console.error('Error al registrar Service Worker', err));
        }

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const grupo = document.getElementById('grupo').value.trim().toLowerCase();

            if(!email || !password || !grupo) return alert("Por favor llena todos los campos");

            try {
                let userCredential;
                try {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                        userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    } else { throw err; }
                }

                const uid = userCredential.user.uid;
                await setDoc(doc(db, "usuarios", uid), { uid, email, grupoID: grupo }, { merge: true });
                solicitarPermisoNotificaciones(uid);

            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioActual = user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                
                const userDoc = await getDoc(doc(db, "usuarios", user.uid));
                grupoActualId = userDoc.data().grupoID;
                document.getElementById('nombre-grupo').innerText = grupoActualId.toUpperCase();

                conectarGrupo(grupoActualId);
            }
        });

        function conectarGrupo(grupoId) {
            onSnapshot(doc(db, "grupos", grupoId), (docSnap) => {
                if (docSnap.exists()) {
                    const datos = docSnap.data();
                    if (datos.estado === "ocupado") {
                        document.getElementById('encargado').classList.remove('hidden');
                        document.getElementById('encargado').querySelector('span').innerText = datos.solicitadoPor || "Desconocido";
                        iniciarContador(datos.finOcupado.toMillis());
                        document.getElementById('btn-ocupado').disabled = true;
                    } else {
                        resetearContadorUI();
                    }
                }
            });

            const q = query(collection(db, "usuarios"), where("grupoID", "==", grupoId));
            onSnapshot(q, (querySnapshot) => {
                const lista = document.getElementById('lista-participantes');
                lista.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const li = document.createElement('li');
                    li.textContent = doc.data().email;
                    lista.appendChild(li);
                });
            });
        }

        document.getElementById('btn-ocupado').addEventListener('click', async () => {
            if (!grupoActualId || !usuarioActual) return;
            
            // 1 HORA EN MILISEGUNDOS (60 minutos * 60 segundos * 1000 ms)
            const tiempoFin = Date.now() + (60 * 60 * 1000); 
            const miEmail = usuarioActual.email;

            await setDoc(doc(db, "grupos", grupoActualId), {
                estado: "ocupado",
                finOcupado: new Date(tiempoFin),
                solicitadoPor: miEmail
            }, { merge: true });

            // ENVIAR NOTIFICACIÓN PUSH A LOS COMPAÑEROS VÍA VERCEL API
            try {
                const q = query(collection(db, "usuarios"), where("grupoID", "==", grupoActualId));
                const querySnapshot = await getDocs(q);
                let listaTokens = [];

                querySnapshot.forEach((doc) => {
                    const datosUsuario = doc.data();
                    if (datosUsuario.tokenPush && datosUsuario.uid !== usuarioActual.uid) {
                        listaTokens.push(datosUsuario.tokenPush);
                    }
                });

                if (listaTokens.length > 0) {
                    await fetch('/api/enviar-alerta', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tokens: listaTokens,
                            titulo: "¡BRC Ocupado! 🚨",
                            mensaje: `${miEmail} pidió el tiempo por 1 hora.`
                        })
                    });
                }
            } catch (err) {
                console.error("Error al procesar envío de push:", err);
            }
        });

        function iniciarContador(tiempoFin) {
            const contadorEl = document.getElementById('contador');
            contadorEl.classList.remove('hidden');
            if(intervaloContador) clearInterval(intervaloContador);

            intervaloContador = setInterval(() => {
                const diferencia = tiempoFin - Date.now();

                if (diferencia <= 0) {
                    clearInterval(intervaloContador);
                    updateDoc(doc(db, "grupos", grupoActualId), { estado: "libre" });
                    resetearContadorUI();
                    return;
                }

                const horas = Math.floor(diferencia / (1000 * 60 * 60));
                const mins = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segs = Math.floor((diferencia % (1000 * 60)) / 1000);
                
                contadorEl.innerText = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function resetearContadorUI() {
            if(intervaloContador) clearInterval(intervaloContador);
            document.getElementById('contador').classList.add('hidden');
            document.getElementById('encargado').classList.add('hidden');
            document.getElementById('btn-ocupado').disabled = false;
        }

        async function solicitarPermisoNotificaciones(uid) {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await getToken(messaging, { vapidKey: 'BK2zWq619-EMLY9Wu_RlBBiWHg0gAtDW7X2mlXD50VO8Nwc5xRIjGNCybV0yTRg-ZCUojFtxw94ewOWaxR5uF60' });
                    if (token) {
                        await setDoc(doc(db, "usuarios", uid), { tokenPush: token }, { merge: true });
                    }
                }
            } catch (error) {
                console.error("Error al obtener token push", error);
            }
        }
    </script>
</body>
</html>
